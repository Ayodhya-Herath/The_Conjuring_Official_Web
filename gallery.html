<!DOCTYPE html>
<html lang="en" class="snap-proximity">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — The Conjuring</title>
  <meta name="description" content="Mood board gallery — location, lighting, props, costume, and texture references for The Conjuring.">
  <link rel="icon" href="assets/favicon.ico">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gallery — The Conjuring">
  <meta property="og:description" content="Mood board gallery — location, lighting, props, costume, and texture references for The Conjuring.">
  <meta property="og:image" content="assets/og-image.jpeg">
  <meta property="og:image:width" content="883">
  <meta property="og:image:height" content="1256">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="grain-overlay" aria-hidden="true"></div>
  <div class="cursor-light" aria-hidden="true"></div>
  <div class="scroll-progress" aria-hidden="true">
    <div class="scroll-progress__track">
      <div class="scroll-progress__flame"></div>
    </div>
  </div>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav__logo">The Conjuring</a>
    <button class="nav__burger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav__links">
      <a href="index.html" class="nav__link">Home</a>
      <a href="synopsis.html" class="nav__link">Synopsis</a>
      <a href="characters.html" class="nav__link">Characters</a>
      <a href="hidden-room.html" class="nav__link">Hidden Room</a>
      <a href="gallery.html" class="nav__link active">Gallery</a>
      <a href="watch.html" class="nav__link">Watch</a>
      <a href="sound.html" class="nav__link">Sound</a>
      <a href="credits.html" class="nav__link">Credits</a>
    </div>
  </nav>

  <!-- Gallery Section -->
  <section class="section snap-section" id="gallery" style="padding-top: calc(var(--space-section) + 3.5rem);">
    <h2 class="section__title scramble-heading">Gallery / Mood Board</h2>

    <!-- Storyboard -->
    <div class="gallery-category reveal">
      <h3 class="gallery-category__title">Storyboard</h3>
      <div class="storyboard-grid">
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-01.jpg" alt="Storyboard frame 1" width="1920" height="1080"><span class="storyboard-frame__label">01</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-02.jpg" alt="Storyboard frame 2" width="1920" height="1080"><span class="storyboard-frame__label">02</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-03.jpg" alt="Storyboard frame 3" width="1920" height="1080"><span class="storyboard-frame__label">03</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-04.jpg" alt="Storyboard frame 4" width="1920" height="1080"><span class="storyboard-frame__label">04</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-05.png" alt="Storyboard frame 5" width="1920" height="1080"><span class="storyboard-frame__label">05</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-06.jpg" alt="Storyboard frame 6" width="1920" height="1080"><span class="storyboard-frame__label">06</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-07.jpg" alt="Storyboard frame 7" width="1920" height="1080"><span class="storyboard-frame__label">07</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-08.jpg" alt="Storyboard frame 8" width="1920" height="1080"><span class="storyboard-frame__label">08</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-09.jpg" alt="Storyboard frame 9" width="1920" height="1080"><span class="storyboard-frame__label">09</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-10.jpg" alt="Storyboard frame 10" width="1920" height="1080"><span class="storyboard-frame__label">10</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-11.jpg" alt="Storyboard frame 11" width="1920" height="1080"><span class="storyboard-frame__label">11</span></div>
        <div class="storyboard-frame gallery-item"><img src="assets/storyboard/storyboard-frame-12.jpg" alt="Storyboard frame 12" width="1920" height="1080"><span class="storyboard-frame__label">12</span></div>
      </div>
    </div>

    <!-- Location -->
    <div class="gallery-category reveal">
      <h3 class="gallery-category__title">Location</h3>
      <div class="gallery-grid">
        <div class="gallery-item tilt-card"><img src="assets/gallery/location/location-farmhouse-exterior.jpg" alt="Farmhouse exterior" width="400" height="400"></div>
        <div class="gallery-item tilt-card"><img src="assets/gallery/location/location-barn-interior.jpg" alt="Barn interior" width="400" height="400"></div>
        <div class="gallery-item tilt-card"><img src="assets/gallery/location/location-cellar-interior.jpg" alt="Cellar interior" width="400" height="400"></div>
      </div>
    </div>

    <!-- Lighting & Mood -->
    <div class="gallery-category reveal">
      <h3 class="gallery-category__title">Lighting &amp; Mood</h3>
      <div class="gallery-grid">
        <div class="gallery-item tilt-card"><img src="assets/gallery/lighting/lighting-attic-flashlight.jpg" alt="Attic flashlight lighting" width="400" height="400"></div>
        <div class="gallery-item tilt-card"><img src="assets/gallery/lighting/lighting-hallway-moonlight.jpg" alt="Hallway moonlight" width="400" height="400"></div>
      </div>
    </div>

    <!-- Props -->
    <div class="gallery-category reveal">
      <h3 class="gallery-category__title">Props</h3>
      <div class="gallery-grid">
        <div class="gallery-item tilt-card"><img src="assets/gallery/props/props-grandfather-clock.jpg" alt="Grandfather clock" width="400" height="400"></div>
        <div class="gallery-item tilt-card"><img src="assets/gallery/props/props-knitting-needles.jpg" alt="Knitting needles" width="400" height="400"></div>
        <div class="gallery-item tilt-card"><img src="assets/gallery/props/props-wax-monkeys.jpg" alt="Wax monkeys" width="400" height="400"></div>
      </div>
    </div>

    <!-- Costume -->
    <div class="gallery-category reveal">
      <h3 class="gallery-category__title">Costume</h3>
      <div class="gallery-grid">
        <div class="gallery-item tilt-card"><img src="assets/gallery/costume/costume-grey-dress.jpg" alt="Grey dress" width="400" height="400"></div>
        <div class="gallery-item tilt-card"><img src="assets/gallery/costume/costume-plaid-shirt.jpg" alt="Plaid shirt" width="400" height="400"></div>
      </div>
    </div>

    <!-- Texture -->
    <div class="gallery-category reveal">
      <h3 class="gallery-category__title">Texture</h3>
      <div class="gallery-grid">
        <div class="gallery-item tilt-card"><img src="assets/gallery/texture/texture-goosebump-skin.jpg" alt="Goosebump skin texture" width="400" height="400"></div>
        <div class="gallery-item tilt-card"><img src="assets/gallery/texture/texture-scratched-door.jpg" alt="Scratched door texture" width="400" height="400"></div>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__close" aria-label="Close lightbox">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous image">&#8249;</button>
    <img class="lightbox__img" alt="">
    <button class="lightbox__nav lightbox__nav--next" aria-label="Next image">&#8250;</button>
  </div>

  <footer class="site-footer snap-section">
    <div class="site-footer__qr">
      <div class="qr-code">
        <img src="assets/qr/qr-code.png" alt="QR code to live site" onerror="this.style.display='none';this.parentElement.textContent='QR CODE';">
      </div>
      <p style="font-size:0.8125rem;color:var(--ink);opacity:0.6;margin:0;">Scan to open the live site</p>
    </div>
    <p class="site-footer__copy">1971 — The Conjuring — a student production, BSc Multimedia</p>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/tilt.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/magnetic.js"></script>
  <script src="js/transitions.js"></script>
</body>
</html>
